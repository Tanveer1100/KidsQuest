openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: children
    description: Parent-owned child profiles
paths:
  /children:
    get:
      operationId: listChildren
      tags: [children]
      summary: List the signed-in parent's child profiles
      responses:
        "200":
          description: Child profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChildProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createChild
      tags: [children]
      summary: Create a child profile for the signed-in parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildInput"
      responses:
        "201":
          description: Saved child profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildProfile"
        "400":
          description: Invalid profile fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /children/{id}:
    patch:
      operationId: updateChild
      tags: [children]
      summary: Update editable details of a child profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChildInput"
      responses:
        "200":
          description: Updated child profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildProfile"
        "400":
          description: Invalid profile fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Profile not found for the signed-in parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    CreateChildInput:
      type: object
      additionalProperties: false
      required: [nickname, ageBucket, defaultLanguage, countryOfResidence]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 40
        ageBucket:
          type: string
          enum: ["3-5", "6-8", "9-12"]
        defaultLanguage:
          type: string
          minLength: 2
          maxLength: 80
          description: Selected language name; no preselected default
        countryOfResidence:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 country code
    UpdateChildInput:
      type: object
      additionalProperties: false
      required: [ageBucket, defaultLanguage, countryOfResidence]
      properties:
        ageBucket:
          type: string
          enum: ["3-5", "6-8", "9-12"]
        defaultLanguage:
          type: string
          minLength: 2
          maxLength: 80
        countryOfResidence:
          type: string
          pattern: "^[A-Z]{2}$"
    ChildProfile:
      type: object
      required: [id, nickname, ageBucket, defaultLanguage, countryOfResidence, createdAt]
      properties:
        id:
          type: integer
        nickname:
          type: string
        ageBucket:
          type: string
          enum: ["3-5", "6-8", "9-12"]
        defaultLanguage:
          type: string
        countryOfResidence:
          type: string
        createdAt:
          type: string
          format: date-time
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

